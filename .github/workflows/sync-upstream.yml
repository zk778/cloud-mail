name: Auto Sync and Deploy Upstream

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync_and_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy-cloudflare workflow
        run: gh workflow run deploy-cloudflare.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
